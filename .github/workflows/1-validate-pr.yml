name: "1. PR Rule Validation & Delete-Safe Check"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  validate-rules:
    name: "Validate Rules, Locks & Delete-Safe"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Execute Validation Gates
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ALLOW_FLAG=""
          if echo "$PR_LABELS" | grep -q '"ALLOW_DELETE"'; then
            echo "Authorized ALLOW_DELETE label detected on PR."
            ALLOW_FLAG="--allow-delete"
          fi
          python3 scripts/validate_rules.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-author "$PR_AUTHOR" \
            $ALLOW_FLAG
